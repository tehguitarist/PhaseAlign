<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blind Listening Test</title>
<style>
:root{--bg:#f4f4f2;--panel:#fff;--ink:#1c1c1e;--mute:#6b6b70;--line:#d9d9d6;--accent:#2a5bd7;--accent-ink:#fff;--sel:#e6edfc;--warn:#b3541e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171a;--panel:#212125;--ink:#ececee;--mute:#9a9aa2;--line:#37373d;--accent:#7a9cff;--accent-ink:#10131c;--sel:#262d45;--warn:#e69a67}}
:root[data-theme="dark"]{--bg:#17171a;--panel:#212125;--ink:#ececee;--mute:#9a9aa2;--line:#37373d;--accent:#7a9cff;--accent-ink:#10131c;--sel:#262d45;--warn:#e69a67}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:860px;margin:0 auto;padding:16px}
header.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
h1{font-size:18px;margin:0;flex:1 1 auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.mute{color:var(--mute)}
button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible,.track:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.progress{display:flex;gap:4px;margin:6px 0 2px}
.progress i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.progress i.done{background:var(--accent)}
.progress i.now{outline:2px solid var(--ink);outline-offset:1px}
.transport{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.track{position:relative;height:38px;background:var(--bg);border:1px solid var(--line);border-radius:8px;margin:12px 0 4px;cursor:pointer;touch-action:none;overflow:hidden}
.track .loop{position:absolute;top:0;bottom:0;background:var(--sel);border-left:2px solid var(--accent);border-right:2px solid var(--accent)}
.track .head{position:absolute;top:0;bottom:0;width:2px;background:var(--ink)}
.opt{display:grid;grid-template-columns:64px 110px 1fr;gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--panel)}
.opt.active{background:var(--sel);border-color:var(--accent)}
.opt .pick{font-size:22px;font-weight:700;height:52px;padding:0}
.opt.active .pick{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt label{display:block;font-size:12px;color:var(--mute)}
select,textarea,input[type=text]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;width:100%}
textarea{resize:vertical;min-height:38px}
.opt.ref{grid-template-columns:64px 1fr}
.row{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.warn{color:var(--warn)}
.sw{display:flex;gap:8px;align-items:center}
@media (max-width:640px){.opt{grid-template-columns:56px 1fr}.opt .c{grid-column:1 / -1}}
ul{padding-left:20px}
</style>
</head>
<body>
<main>
<header class="bar">
  <h1>Blind Listening Test</h1>
  <label class="sw"><input type="checkbox" id="lm" checked> Match levels</label>
  <button id="save" title="Download everything so far">Save results</button>
</header>
<div id="view"></div>
</main>
<script>
"use strict";
const MANIFEST = /*MANIFEST*/[];
const BUILD = /*BUILD*/"";
const STORE = "pa-blind3-v1";
const DATA = {};            // test id -> raw data from its .js file
let ctx = null, audio = null;   // audio: the loaded test's engine
let state = {version: 1, build: BUILD, started: null, finished: null, levelMatch: true, tests: {}, at: 0};
let stale = false;     // answers from another build of this page were found and set aside
let ui = {screen: "intro"};

// ---- persistence (best effort: the page works without it) ----
function save() { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {} }
function restore() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE) || "null");
    if (s && s.version === 1 && s.build === BUILD) state = s;
    else if (s) { localStorage.setItem(STORE + "-old", JSON.stringify(s)); localStorage.removeItem(STORE); stale = true; }
  } catch (e) {}
}
function T(id) {
  return state.tests[id] || (state.tests[id] = {ranks: {}, comments: {}, note: "", secs: {}, switches: 0, plays: 0, loop: null, visited: false});
}
function ranked(id) { const m = MANIFEST.find(t => t.id === id); return m.options.filter(o => T(id).ranks[o]).length; }

// ---- audio ----
function ensureCtx() {
  if (!ctx) { ctx = new (window.AudioContext || window.webkitAudioContext)({sampleRate: 48000}); }
  if (ctx.state === "suspended") ctx.resume();
}
function decode(d, ch, rate) {
  const bin = atob(d.d), u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  const pcm = new Int16Array(u8.buffer), frames = pcm.length / ch;
  const buf = ctx.createBuffer(ch, frames, rate);
  for (let c = 0; c < ch; c++) { const o = buf.getChannelData(c); for (let i = 0; i < frames; i++) o[i] = pcm[i * ch + c] / 32768; }
  return buf;
}
function loadScript(entry) {
  return new Promise((res, rej) => {
    if (DATA[entry.id]) return res();
    const s = document.createElement("script");
    s.src = entry.file; s.onload = () => res(); s.onerror = () => rej(new Error("could not load " + entry.file));
    document.head.appendChild(s);
  });
}
window.__load = (id, data) => { DATA[id] = data; };

function stopAudio() {
  if (!audio) return;
  audio.stopSources(); audio.playing = false;
}
async function openTest(id) {
  if (audio) { stopAudio(); }
  const entry = MANIFEST.find(t => t.id === id);
  ui = {screen: "test", id, loading: true}; render();
  ensureCtx();
  await loadScript(entry);
  const d = DATA[id];
  const buffers = {}, nodes = {};
  const master = ctx.createGain(); master.connect(ctx.destination);
  const all = Object.keys(d.clips).concat(["ref"]);
  for (const k of all) {
    const raw = k === "ref" ? d.ref : d.clips[k];
    buffers[k] = decode(raw, d.ch, d.rate);
    const g = ctx.createGain(); g.gain.value = 0; g.connect(master); nodes[k] = {gain: g, m: raw.m, src: null};
  }
  const dur = buffers.ref.duration, t = T(id);
  audio = {id, buffers, nodes, dur, playing: false, pos: 0, t0: 0, off0: 0, sel: null, loop: t.loop || [0, dur],
    stopSources() { for (const k in nodes) { const n = nodes[k]; if (n.src) { try { n.src.stop(); } catch (e) {} n.src.disconnect(); n.src = null; } } },
    position() {
      if (!this.playing) return this.pos;
      const [a, b] = this.loop; let p = this.off0 + (ctx.currentTime - this.t0);
      if (p >= b) p = a + ((p - a) % (b - a)); return p;
    },
    startAt(p) {
      this.stopSources();
      const [a, b] = this.loop; if (p < a || p >= b) p = a;
      const when = ctx.currentTime + 0.02;
      for (const k in nodes) {
        const s = ctx.createBufferSource(); s.buffer = buffers[k]; s.loop = true; s.loopStart = a; s.loopEnd = b;
        s.connect(nodes[k].gain); s.start(when, p); nodes[k].src = s;
      }
      this.t0 = when; this.off0 = p; this.playing = true; t.plays++;
    },
    pause() { this.pos = this.position(); this.stopSources(); this.playing = false; },
    setLoop(a, b) {
      this.loop = [a, b]; t.loop = (a <= 0.001 && b >= dur - 0.001) ? null : [a, b];
      const p = this.position();
      if (this.playing) { for (const k in nodes) if (nodes[k].src) { nodes[k].src.loopStart = a; nodes[k].src.loopEnd = b; } this.startAt(p < a || p >= b ? a : p); } else this.pos = a;
      save();
    },
    select(k) {
      this.sel = k;
      for (const j in nodes) {
        const on = j === k, v = on ? (state.levelMatch ? nodes[j].m : (j === "ref" ? nodes[j].m : 1)) : 0;
        nodes[j].gain.gain.setTargetAtTime(v, ctx.currentTime, 0.004);
      }
    },
  };
  t.visited = true; ui.loading = false; save();
  audio.select(entry.options[0]);
  render();
}

// ---- views ----
const $ = s => document.querySelector(s), view = $("#view");
const letter = i => String.fromCharCode(65 + i);
function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const k in (attrs || {})) { if (k === "class") e.className = attrs[k]; else if (k.startsWith("on")) e.addEventListener(k.slice(2), attrs[k]); else e.setAttribute(k, attrs[k]); }
  for (const c of kids.flat()) if (c != null) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
}
function render() {
  view.replaceChildren();
  if (ui.screen === "intro") return renderIntro();
  if (ui.screen === "done") return renderDone();
  renderTest();
}
function firstUnfinished() {
  const i = MANIFEST.findIndex(t => ranked(t.id) < t.options.length);
  return i < 0 ? 0 : i;
}
function renderIntro() {
  const any = Object.keys(state.tests).length > 0;
  view.append(el("div", {class: "panel"},
    el("p", {}, "Each test plays the same few seconds of music in several versions. In every version a track is combined with a reference, and the versions differ only in how that track is treated. Letters are shuffled in every test and mean nothing."),
    el("ul", {},
      el("li", {}, "Press Play. All versions run in time with each other, so switching letters carries on from the same place, with no restart."),
      el("li", {}, "REF plays the reference on its own, to reset your ears."),
      el("li", {}, "Rank the versions by how good they sound to you (1 = best). Equal ranks are allowed. Comments are optional but useful."),
      el("li", {}, "Drag across the bar to loop a section. Click it to jump. Space starts and stops. Keys 1 to 9 pick a version, 0 picks REF."),
      el("li", {}, "“Match levels” evens out loudness, so a louder version does not win just for being louder. Your answers record which setting you used. Use the same listening volume throughout."),
      el("li", {}, "Progress saves in this browser as you go. “Save results” downloads a file you can send back at any time.")),
    el("p", {class: "mute"}, `${MANIFEST.filter(t => t.part === 1).length} tests in part 1, then ${MANIFEST.filter(t => t.part === 2).length} optional ones in part 2 and ${MANIFEST.filter(t => t.part === 3).length} in part 3 (part 3 is one song, recorded with real mics; every test is the same kind of comparison).`),
    stale ? el("p", {class: "warn"}, "Answers saved by an earlier version of this page were found and set aside, because the page has been rebuilt and the letters no longer mean the same. Start from the beginning here (the old ones were not deleted).") : null,
    el("div", {class: "row"},
      el("button", {class: "primary", onclick: () => { if (!state.started) state.started = new Date().toISOString(); ensureCtx(); openTest(any ? MANIFEST[firstUnfinished()].id : MANIFEST[0].id); }}, any ? "Continue" : "Begin"),
      any ? el("button", {onclick: () => { if (confirm("Throw away the saved answers and start again?")) { state = {version: 1, build: BUILD, started: null, finished: null, levelMatch: true, tests: {}, at: 0}; save(); $("#lm").checked = true; render(); } }}, "Start again") : null)));
}
function renderDone() {
  const unranked = MANIFEST.filter(t => ranked(t.id) < t.options.length).length;
  view.append(el("div", {class: "panel"},
    el("h2", {}, "That's the last test"),
    el("p", {}, unranked ? `${unranked} test(s) are not fully ranked. You can go back to them, or save as they are.` : "Everything is ranked."),
    el("div", {class: "row"}, el("button", {class: "primary", onclick: exportResults}, "Download results"), el("button", {onclick: () => openTest(MANIFEST[MANIFEST.length - 1].id)}, "Back to the last test"))));
}
function renderTest() {
  const id = ui.id, idx = MANIFEST.findIndex(t => t.id === id), entry = MANIFEST[idx], t = T(id);
  view.append(el("div", {class: "panel"},
    el("div", {class: "row"}, el("strong", {}, `Test ${idx + 1} of ${MANIFEST.length}`), el("span", {class: "mute"}, entry.part === 1 ? "Part 1" : "Part " + entry.part + " (optional)")),
    el("div", {class: "progress", role: "progressbar", "aria-valuemin": 0, "aria-valuemax": MANIFEST.length, "aria-valuenow": idx + 1},
      MANIFEST.map((m, i) => el("i", {class: (ranked(m.id) === m.options.length ? "done " : "") + (i === idx ? "now" : "")})))));
  if (ui.loading || !audio || audio.id !== id) { view.append(el("p", {class: "mute"}, "Loading…")); return; }
  const track = el("div", {class: "track", tabindex: 0, role: "slider", "aria-label": "Playback position"},
    el("div", {class: "loop"}), el("div", {class: "head"}));
  const timeLabel = el("span", {class: "mute", id: "time"}, "");
  const play = el("button", {class: "primary", id: "play", onclick: togglePlay}, audio.playing ? "Pause" : "Play");
  view.append(el("div", {class: "panel"},
    el("div", {class: "transport"}, play, el("button", {onclick: () => { audio.setLoop(0, audio.dur); layoutLoop(); }}, "Clear loop"), timeLabel),
    track));
  const refRow = el("div", {class: "opt ref" + (audio.sel === "ref" ? " active" : ""), "data-k": "ref"},
    el("button", {class: "pick", onclick: () => choose("ref"), "aria-label": "Reference alone (key 0)"}, "REF"),
    el("div", {class: "mute"}, "The reference on its own"));
  view.append(refRow);
  entry.options.forEach((o, i) => {
    const sel = el("select", {"aria-label": `Rank for ${letter(i)}`, onchange: e => { t.ranks[o] = e.target.value ? +e.target.value : null; save(); refreshProgress(); }},
      el("option", {value: ""}, "—"), entry.options.map((_, j) => el("option", {value: j + 1}, String(j + 1))));
    sel.value = t.ranks[o] || "";
    const ta = el("textarea", {rows: 1, placeholder: "Comment (optional)", "aria-label": `Comment for ${letter(i)}`, oninput: e => { t.comments[o] = e.target.value; save(); }});
    ta.value = t.comments[o] || "";
    view.append(el("div", {class: "opt" + (audio.sel === o ? " active" : ""), "data-k": o},
      el("button", {class: "pick", onclick: () => choose(o), "aria-label": `Version ${letter(i)} (key ${i + 1})`}, letter(i)),
      el("div", {}, el("label", {}, "Rank (1 = best)"), sel),
      el("div", {class: "c"}, ta)));
  });
  const note = el("textarea", {rows: 2, placeholder: "Anything about this test as a whole (optional)", "aria-label": "Notes on this test", oninput: e => { t.note = e.target.value; save(); }});
  note.value = t.note || "";
  view.append(el("div", {class: "panel"}, note,
    el("div", {class: "row", style: "margin-top:10px"},
      el("button", {onclick: () => go(idx - 1), disabled: idx === 0 ? "" : null}, "Back"),
      el("span", {class: "warn", id: "unr"}),
      el("button", {class: "primary", onclick: () => go(idx + 1)}, idx === MANIFEST.length - 1 ? "Finish" : "Next"))));
  bindTrack(track); layoutLoop(); refreshProgress();
  const next = MANIFEST[idx + 1]; if (next) loadScript(next).catch(() => {});
}
function refreshProgress() {
  const u = $("#unr"); if (!u || !ui.id) return;
  const m = MANIFEST.find(t => t.id === ui.id), n = m.options.length - ranked(ui.id);
  u.textContent = n ? `${n} not ranked yet` : "";
}
function go(i) {
  if (audio) { audio.pause(); }
  if (i < 0) return;
  if (i >= MANIFEST.length) { state.finished = new Date().toISOString(); save(); ui = {screen: "done"}; render(); return; }
  openTest(MANIFEST[i].id);
}
function choose(k) {
  if (!audio) return;
  const t = T(audio.id);
  if (audio.sel !== k && k !== "ref" && audio.sel !== "ref") t.switches++;
  audio.select(k);
  document.querySelectorAll(".opt").forEach(n => n.classList.toggle("active", n.dataset.k === k));
  save();
}
function togglePlay() {
  ensureCtx(); if (!audio) return;
  if (audio.playing) audio.pause(); else audio.startAt(audio.pos);
  const b = $("#play"); if (b) b.textContent = audio.playing ? "Pause" : "Play";
}
function bindTrack(track) {
  let x0 = null, drag = false;
  const frac = e => { const r = track.getBoundingClientRect(); return Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)); };
  track.addEventListener("pointerdown", e => { x0 = frac(e); drag = false; track.setPointerCapture(e.pointerId); });
  track.addEventListener("pointermove", e => {
    if (x0 === null) return; const f = frac(e);
    if (Math.abs(f - x0) * track.clientWidth > 5) {
      drag = true; const a = Math.min(f, x0) * audio.dur, b = Math.max(f, x0) * audio.dur; audio.loop = [a, Math.max(b, a + 0.3)]; layoutLoop();
    }
  });
  track.addEventListener("pointerup", e => {
    if (x0 === null) return; const f = frac(e);
    if (drag) { const a = Math.min(f, x0) * audio.dur, b = Math.max(f, x0) * audio.dur; audio.setLoop(a, Math.max(b, a + 0.3)); }
    else { const p = f * audio.dur; if (p < audio.loop[0] || p > audio.loop[1]) audio.setLoop(0, audio.dur); if (audio.playing) audio.startAt(p); else audio.pos = p; }
    x0 = null; layoutLoop();
  });
  track.addEventListener("keydown", e => {
    if (e.key === "ArrowRight" || e.key === "ArrowLeft") { const p = Math.max(0, Math.min(audio.dur - 0.01, audio.position() + (e.key === "ArrowRight" ? 1 : -1))); if (audio.playing) audio.startAt(p); else audio.pos = p; e.preventDefault(); }
  });
}
function layoutLoop() {
  const tr = document.querySelector(".track"); if (!tr || !audio) return;
  const l = tr.querySelector(".loop"), [a, b] = audio.loop;
  const full = a <= 0.001 && b >= audio.dur - 0.001; l.style.display = full ? "none" : "";
  l.style.left = (a / audio.dur * 100) + "%"; l.style.width = ((b - a) / audio.dur * 100) + "%";
}
let last = performance.now();
function tick(now) {
  const dt = (now - last) / 1000; last = now;
  if (audio && ui.screen === "test" && audio.id === ui.id) {
    const p = audio.position(), head = document.querySelector(".track .head");
    if (head) head.style.left = (p / audio.dur * 100) + "%";
    const tl = $("#time"); if (tl) tl.textContent = `${p.toFixed(1)} / ${audio.dur.toFixed(1)} s` + (audio.loop[0] > 0.001 || audio.loop[1] < audio.dur - 0.001 ? `  (loop ${audio.loop[0].toFixed(1)} to ${audio.loop[1].toFixed(1)} s)` : "");
    if (audio.playing && audio.sel && audio.sel !== "ref") { const s = T(audio.id).secs; s[audio.sel] = (s[audio.sel] || 0) + dt; }
  }
  requestAnimationFrame(tick);
}
function exportResults() {
  const out = {version: 1, kind: "blind3", build: BUILD, started: state.started, finished: state.finished, exported: new Date().toISOString(),
    levelMatchAtExport: state.levelMatch, sampleRate: ctx ? ctx.sampleRate : null, userAgent: navigator.userAgent,
    tests: MANIFEST.map((m, i) => ({id: m.id, order: i + 1, part: m.part, options: m.options, ...T(m.id)}))};
  const blob = new Blob([JSON.stringify(out, null, 1)], {type: "application/json"});
  const a = el("a", {href: URL.createObjectURL(blob), download: `blind3-results-${new Date().toISOString().slice(0, 10)}.json`});
  document.body.append(a); a.click(); a.remove();
}
$("#save").addEventListener("click", exportResults);
$("#lm").addEventListener("change", e => { state.levelMatch = e.target.checked; save(); if (audio && audio.sel) audio.select(audio.sel); });
document.addEventListener("keydown", e => {
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "textarea" || tag === "input" || tag === "select" || ui.screen !== "test" || !audio) return;
  if (e.code === "Space") { e.preventDefault(); togglePlay(); }
  else if (/^[0-9]$/.test(e.key)) { const m = MANIFEST.find(t => t.id === ui.id); const k = e.key === "0" ? "ref" : m.options[+e.key - 1]; if (k) choose(k); }
});
restore(); $("#lm").checked = state.levelMatch; render(); requestAnimationFrame(tick);
</script>
</body>
</html>
