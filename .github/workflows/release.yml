# Manual-trigger packaging: builds VST3 (+ AU on macOS) on all three platforms, packages a basic
# installer per platform (.pkg/.exe/.deb) alongside a raw zip, and publishes everything to a
# GitHub Release. No push/schedule trigger — it ONLY runs when you start it from the Actions tab
# or `gh workflow run release.yml`, so a release is never cut accidentally.
#
# macOS ships TWO builds: `macos` (native Apple Silicon, arm64) and `macos-intel` (x86_64, cross-
# compiled on the same Apple Silicon runner via -DCMAKE_OSX_ARCHITECTURES=x86_64 rather than on
# GitHub's near-retired macos-13 Intel-hosted pool). Both are signed/notarized identically; the Intel job's filenames carry an
# "-Intel" tag so the two never collide in the same Release.
#
# macOS artifacts are signed with a Developer ID Application certificate and notarized via
# notarytool, using secrets configured in the repo (APPLE_CERT_P12_BASE64, APPLE_CERT_PASSWORD,
# APPLE_SIGNING_IDENTITY, APPLE_TEAM_ID, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD).
#
# The macOS .pkg installer is built from installer/macos/ and wraps the (signed/notarized) AU/VST3
# bundles with a choice screen — both formats selected by default. The .pkg itself is also signed
# (productsign, a separate "Developer ID Installer" cert from the Application one used on the
# bundles — APPLE_INSTALLER_CERT_P12_BASE64, APPLE_INSTALLER_CERT_PASSWORD,
# APPLE_INSTALLER_SIGNING_IDENTITY) and notarized/stapled by the "Sign + notarize installer" step,
# so it shows no Gatekeeper warning on double-click either. The Windows .exe (NSIS) and Linux .deb
# are VST3-only since neither platform has AU.
name: Release

on:
  workflow_dispatch:
    inputs:
      draft:
        description: "Create as a draft release (review before publishing)"
        type: boolean
        default: true
      skip_ci_check:
        description: "Release even though CI has not passed on this commit (leave off unless you know why)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read # the CI check below reads the commit's CI runs

jobs:
  version:
    name: Check CI, read version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      # Every job below needs this one, so a commit whose CI has not passed (or has not finished, or never ran) cannot
      # be released: the release builds run with the tests off, so this is the only place the tests gate a release.
      - name: Require a passing CI run on this commit
        if: ${{ ! inputs.skip_ci_check }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RESULT=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --limit 1 --json status,conclusion,url \
                   --jq 'if length == 0 then "none" else .[0] | "\(.status) \(.conclusion) \(.url)" end')
          echo "Latest CI run for $GITHUB_SHA: $RESULT"
          case "$RESULT" in
            "completed success "*) ;;
            none) echo "::error::CI has not run on $GITHUB_SHA: push it and wait for a green run first (or tick skip_ci_check)."; exit 1 ;;
            *) echo "::error::The latest CI run on $GITHUB_SHA is not green ($RESULT). Wait for it or fix it (or tick skip_ci_check)."; exit 1 ;;
          esac
      - id: read
        run: |
          VERSION=$(grep -oP '(?<=project\(PhaseAlign VERSION )[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt)
          echo "Read version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  macos:
    name: macOS build
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with: { submodules: recursive }

      - name: Configure
        # arm64 only, stated rather than left to the runner, so this job never ships a universal or Intel binary.
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 -DPA_BUILD_TESTS=OFF

      - name: Build AU + VST3
        run: cmake --build build --config Release --target PhaseAlign_AU --target PhaseAlign_VST3 --parallel

      - name: Import signing certificates
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_INSTALLER_CERT_P12_BASE64: ${{ secrets.APPLE_INSTALLER_CERT_P12_BASE64 }}
          APPLE_INSTALLER_CERT_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          INSTALLER_CERT_PATH="$RUNNER_TEMP/installer-cert.p12"

          echo "$APPLE_CERT_P12_BASE64" | base64 --decode -o "$CERT_PATH"
          echo "$APPLE_INSTALLER_CERT_P12_BASE64" | base64 --decode -o "$INSTALLER_CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security import "$INSTALLER_CERT_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_INSTALLER_CERT_PASSWORD" -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productsign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

          rm -f "$CERT_PATH" "$INSTALLER_CERT_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Sign AU + VST3
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          for bundle in \
            "build/PhaseAlign_artefacts/Release/AU/Phase Align.component" \
            "build/PhaseAlign_artefacts/Release/VST3/Phase Align.vst3"; do
            codesign --force --deep --options runtime --timestamp \
              --sign "$APPLE_SIGNING_IDENTITY" --keychain "$KEYCHAIN_PATH" "$bundle"
            codesign --verify --deep --strict --verbose=2 "$bundle"
          done

      - name: Notarize AU + VST3
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          NOTARIZE_ZIP="$RUNNER_TEMP/notarize.zip"
          NOTARIZE_DIR="$RUNNER_TEMP/notarize"
          mkdir -p "$NOTARIZE_DIR"
          cp -R "build/PhaseAlign_artefacts/Release/AU/Phase Align.component" "$NOTARIZE_DIR/"
          cp -R "build/PhaseAlign_artefacts/Release/VST3/Phase Align.vst3" "$NOTARIZE_DIR/"
          ditto -c -k --keepParent "$NOTARIZE_DIR" "$NOTARIZE_ZIP"

          xcrun notarytool submit "$NOTARIZE_ZIP" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          xcrun stapler staple "build/PhaseAlign_artefacts/Release/AU/Phase Align.component"
          xcrun stapler staple "build/PhaseAlign_artefacts/Release/VST3/Phase Align.vst3"

      - name: Package
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          # Zip only the AU/VST3 bundles, NOT the whole Release dir — that also contains
          # "libPhase Align_SharedCode.a" (a build byproduct, not something an end user installs).
          # ditto -c can't take multiple sources directly, so stage them into one dir first
          # (named "Phase Align" so --keepParent gives the zip a clean top-level folder).
          PKG_DIR="$RUNNER_TEMP/Phase Align"
          mkdir -p "$PKG_DIR"
          cp -R "build/PhaseAlign_artefacts/Release/AU" "build/PhaseAlign_artefacts/Release/VST3" "$PKG_DIR/"
          installer/stage_docs.sh "$PKG_DIR" "$VERSION" # the readme and licences, which the licences require
          ditto -c -k --sequesterRsrc --keepParent "$PKG_DIR" "PhaseAlign-macOS-v${VERSION}.zip"

      - name: Build installer
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          installer/macos/build_installer.sh "$VERSION" build/PhaseAlign_artefacts/Release .

      - name: Sign + notarize installer
        env:
          APPLE_INSTALLER_SIGNING_IDENTITY: ${{ secrets.APPLE_INSTALLER_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          PKG="PhaseAlign-macOS-v${VERSION}-Installer.pkg"
          SIGNED_PKG="$RUNNER_TEMP/signed.pkg"

          productsign --sign "$APPLE_INSTALLER_SIGNING_IDENTITY" --keychain "$KEYCHAIN_PATH" \
            "$PKG" "$SIGNED_PKG"
          mv "$SIGNED_PKG" "$PKG"

          xcrun notarytool submit "$PKG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          xcrun stapler staple "$PKG"

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN_PATH" || true

      - uses: actions/upload-artifact@v6
        with:
          name: PhaseAlign-macOS
          path: |
            PhaseAlign-macOS-v*.zip
            PhaseAlign-macOS-v*.pkg

  macos-intel:
    name: macOS build (Intel)
    needs: version
    # GitHub's macos-13 (Intel-hosted) runner pool has become unreliable/near-retired — jobs can
    # sit in "waiting for a runner" indefinitely. Build the Intel slice by CROSS-COMPILING on the
    # Apple Silicon runner instead (Xcode's clang + the macOS SDK support this natively via
    # -DCMAKE_OSX_ARCHITECTURES=x86_64 below) — no Intel hardware needed, and it's not subject to
    # that pool's availability.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with: { submodules: recursive }

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=x86_64 -DPA_BUILD_TESTS=OFF

      - name: Build AU + VST3
        run: cmake --build build --config Release --target PhaseAlign_AU --target PhaseAlign_VST3 --parallel

      - name: Import signing certificates
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_INSTALLER_CERT_P12_BASE64: ${{ secrets.APPLE_INSTALLER_CERT_P12_BASE64 }}
          APPLE_INSTALLER_CERT_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          INSTALLER_CERT_PATH="$RUNNER_TEMP/installer-cert.p12"

          echo "$APPLE_CERT_P12_BASE64" | base64 --decode -o "$CERT_PATH"
          echo "$APPLE_INSTALLER_CERT_P12_BASE64" | base64 --decode -o "$INSTALLER_CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security import "$INSTALLER_CERT_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_INSTALLER_CERT_PASSWORD" -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productsign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

          rm -f "$CERT_PATH" "$INSTALLER_CERT_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Sign AU + VST3
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          for bundle in \
            "build/PhaseAlign_artefacts/Release/AU/Phase Align.component" \
            "build/PhaseAlign_artefacts/Release/VST3/Phase Align.vst3"; do
            codesign --force --deep --options runtime --timestamp \
              --sign "$APPLE_SIGNING_IDENTITY" --keychain "$KEYCHAIN_PATH" "$bundle"
            codesign --verify --deep --strict --verbose=2 "$bundle"
          done

      - name: Notarize AU + VST3
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          NOTARIZE_ZIP="$RUNNER_TEMP/notarize.zip"
          NOTARIZE_DIR="$RUNNER_TEMP/notarize"
          mkdir -p "$NOTARIZE_DIR"
          cp -R "build/PhaseAlign_artefacts/Release/AU/Phase Align.component" "$NOTARIZE_DIR/"
          cp -R "build/PhaseAlign_artefacts/Release/VST3/Phase Align.vst3" "$NOTARIZE_DIR/"
          ditto -c -k --keepParent "$NOTARIZE_DIR" "$NOTARIZE_ZIP"

          xcrun notarytool submit "$NOTARIZE_ZIP" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          xcrun stapler staple "build/PhaseAlign_artefacts/Release/AU/Phase Align.component"
          xcrun stapler staple "build/PhaseAlign_artefacts/Release/VST3/Phase Align.vst3"

      - name: Package
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          # Zip only the AU/VST3 bundles, NOT the whole Release dir — see the ARM job's comment.
          # Filenames carry an "Intel" tag so this job's assets never collide with the ARM job's
          # when both land in the same GitHub Release.
          PKG_DIR="$RUNNER_TEMP/Phase Align"
          mkdir -p "$PKG_DIR"
          cp -R "build/PhaseAlign_artefacts/Release/AU" "build/PhaseAlign_artefacts/Release/VST3" "$PKG_DIR/"
          installer/stage_docs.sh "$PKG_DIR" "$VERSION" # the readme and licences, which the licences require
          ditto -c -k --sequesterRsrc --keepParent "$PKG_DIR" "PhaseAlign-macOS-Intel-v${VERSION}.zip"

      - name: Build installer
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          installer/macos/build_installer.sh "$VERSION" build/PhaseAlign_artefacts/Release .
          # build_installer.sh always names its output "PhaseAlign-macOS-v<version>-Installer.pkg" —
          # rename it so this Intel build's asset doesn't collide with the ARM job's.
          mv "PhaseAlign-macOS-v${VERSION}-Installer.pkg" "PhaseAlign-macOS-Intel-v${VERSION}-Installer.pkg"

      - name: Sign + notarize installer
        env:
          APPLE_INSTALLER_SIGNING_IDENTITY: ${{ secrets.APPLE_INSTALLER_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          PKG="PhaseAlign-macOS-Intel-v${VERSION}-Installer.pkg"
          SIGNED_PKG="$RUNNER_TEMP/signed.pkg"

          productsign --sign "$APPLE_INSTALLER_SIGNING_IDENTITY" --keychain "$KEYCHAIN_PATH" \
            "$PKG" "$SIGNED_PKG"
          mv "$SIGNED_PKG" "$PKG"

          xcrun notarytool submit "$PKG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          xcrun stapler staple "$PKG"

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN_PATH" || true

      - uses: actions/upload-artifact@v6
        with:
          name: PhaseAlign-macOS-Intel
          path: |
            PhaseAlign-macOS-Intel-v*.zip
            PhaseAlign-macOS-Intel-v*.pkg

  windows:
    name: Windows build
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with: { submodules: recursive }

      - name: Configure
        run: cmake -B build -DPA_BUILD_TESTS=OFF

      - name: Build VST3
        run: cmake --build build --config Release --target PhaseAlign_VST3 --parallel

      - name: Package
        shell: pwsh
        run: |
          $version = "${{ needs.version.outputs.version }}"
          # The bundle plus the readme and licences, which the licences require with a binary copy.
          $stage = "$env:RUNNER_TEMP\Phase Align"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Recurse "build/PhaseAlign_artefacts/Release/VST3/Phase Align.vst3" $stage
          bash installer/stage_docs.sh "$($stage -replace '\\','/')" $version
          Compress-Archive -Path $stage -DestinationPath "PhaseAlign-Windows-v$version.zip"

      # makensis ships on windows-latest runners but is NOT on PATH — locate it rather than
      # assume a bare `makensis` call works (it doesn't).
      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ needs.version.outputs.version }}"

          $makensis = Get-Command makensis.exe -ErrorAction SilentlyContinue
          if ($makensis) {
            $makensisPath = $makensis.Source
          } else {
            $candidates = @(
              "$env:ProgramFiles\NSIS\makensis.exe",
              "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
            )
            $makensisPath = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }

          if (-not $makensisPath) {
            Write-Host "makensis not found on this runner — installing via Chocolatey"
            choco install nsis -y --no-progress
            $makensisPath = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          }

          Write-Host "Using makensis at $makensisPath"
          bash installer/stage_docs.sh build/docs $version
          & $makensisPath /DVERSION=$version /DARTEFACTS_DIR="$PWD\build\PhaseAlign_artefacts\Release\VST3" /DDOCS_DIR="$PWD\build\docs" installer\windows\PhaseAlign.nsi

          # NSIS resolves a relative OutFile against the .nsi's own directory, not this process's
          # CWD — move the built installer to the repo root so the upload-artifact glob finds it.
          Move-Item "installer\windows\PhaseAlign-Windows-v$version-Installer.exe" .

      - uses: actions/upload-artifact@v6
        with:
          name: PhaseAlign-Windows
          path: |
            PhaseAlign-Windows-v*.zip
            PhaseAlign-Windows-v*.exe

  linux:
    name: Linux build
    needs: version
    runs-on: ubuntu-24.04  # pinned as in ci.yml (ubuntu-latest changes image versions over time)
    steps:
      - uses: actions/checkout@v6
        with: { submodules: recursive }

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev \
            libfreetype6-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev \
            libglu1-mesa-dev mesa-common-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DPA_BUILD_TESTS=OFF

      - name: Build VST3
        run: cmake --build build --config Release --target PhaseAlign_VST3 --parallel

      - name: Package
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          # The bundle plus the readme and licences, which the licences require with a binary copy.
          STAGE="$RUNNER_TEMP/Phase Align"
          mkdir -p "$STAGE"
          cp -R "build/PhaseAlign_artefacts/Release/VST3/Phase Align.vst3" "$STAGE/"
          installer/stage_docs.sh "$STAGE" "$VERSION"
          (cd "$RUNNER_TEMP" && zip -r "${GITHUB_WORKSPACE}/PhaseAlign-Linux-v${VERSION}.zip" "Phase Align")

      - name: Build installer
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          installer/linux/build_deb.sh "$VERSION" build/PhaseAlign_artefacts/Release .

      - uses: actions/upload-artifact@v6
        with:
          name: PhaseAlign-Linux
          path: |
            PhaseAlign-Linux-v*.zip
            PhaseAlign-Linux-v*.deb

  publish:
    name: Publish release
    needs: [version, macos, macos-intel, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with: { path: artifacts }
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Phase Align v${{ needs.version.outputs.version }}
          draft: ${{ inputs.draft }}
          files: |
            artifacts/**/*.zip
            artifacts/**/*.pkg
            artifacts/**/*.exe
            artifacts/**/*.deb
