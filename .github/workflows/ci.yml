# Build CI for Phase Align (AU/VST3, JUCE 9). Runs the Catch2 tests (ctest) on every OS; macOS also runs
# auval and pluginval to check the plugin loads and behaves.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch: # run on any branch from the Actions tab or `gh workflow run ci.yml --ref <branch>`

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu pinned: ubuntu-latest moves to 26.04 from 2026-10-19, which may rename apt packages or change the
        # fonts the editor tests render with. Move the pin deliberately, after one green run on the new image.
        os: [macos-latest, windows-latest, ubuntu-24.04]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev \
            libfreetype6-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev \
            libglu1-mesa-dev mesa-common-dev xvfb

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        # Cap parallelism on macOS/Linux: unbounded --parallel can exhaust RAM on the hosted runners
        # (macOS 3 vCPU/14GB: heavy .mm compiles thrash; Linux 4 vCPU/16GB: kernel OOM-kills cc1plus
        # on juce_gui_basics translation units). JUCE's CMake helpers don't share object files across
        # targets, so each extra target recompiles the JUCE modules. Windows hasn't needed a cap.
        run: cmake --build build --config Release --parallel ${{ (runner.os == 'macOS' && 3) || (runner.os == 'Linux' && 2) || '' }}

      - name: Test
        shell: bash
        # The editor tests need a display server, which Linux runners don't have; xvfb provides one.
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a ctest --test-dir build -C Release --output-on-failure
          else
            ctest --test-dir build -C Release --output-on-failure
          fi

      - name: Benchmark the DSP (information only)
        # Numbers for IMPLEMENTATION_PLAN 2.6 on every OS: Windows and Linux use PFFFT (no vDSP).
        # Budgets per stereo frame: Hi/Lo under 50 ns, Constant under 150 ns. Never fails the build.
        continue-on-error: true
        shell: bash
        run: |
          bin=build/PhaseAlignDspTests_artefacts/Release/PhaseAlignDspTests
          [ -f "$bin.exe" ] && bin="$bin.exe"
          "$bin" "chain cost per stereo frame" 2>&1 | grep -E 'ns per|us$' || true
          "$bin" "convolver cost per stereo frame by block layout" 2>&1 | grep -E 'ns per' || true

      - name: Validate AU (auval)
        if: runner.os == 'macOS'
        run: |
          # CMake doesn't install the AU after building (COPY_PLUGIN_AFTER_BUILD is off so local
          # builds don't touch ~/Library), so copy it where auval and the registrar look.
          mkdir -p "$HOME/Library/Audio/Plug-Ins/Components"
          cp -R "build/PhaseAlign_artefacts/Release/AU/Phase Align.component" "$HOME/Library/Audio/Plug-Ins/Components/"
          # On a clean CI runner the freshly-copied .component isn't registered with the
          # AudioComponentRegistrar yet, so auval reports "didn't find the component" / -50.
          # Bounce the registrar so it rescans ~/Library/Audio/Plug-Ins/Components and retry.
          ls -la "$HOME/Library/Audio/Plug-Ins/Components/" || true
          ok=0
          for i in 1 2 3 4; do
            if auval -v aufx PhAl Lprc; then ok=1; break; fi
            echo "::warning::auval attempt $i failed; bouncing AudioComponentRegistrar and retrying"
            killall -9 AudioComponentRegistrar 2>/dev/null || true
            sleep 5
          done
          [ "$ok" = 1 ]

      - name: Validate VST3 (pluginval)
        if: runner.os == 'macOS'
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          pluginval.app/Contents/MacOS/pluginval --version || true
          pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --validate-in-process \
            --timeout-ms 300000 --output-dir pluginval-logs "build/PhaseAlign_artefacts/Release/VST3/Phase Align.vst3"

      - name: Validate VST3 (pluginval, Windows and Linux; information only)
        # Not yet seen green on these runners, so it can't fail the build; drop continue-on-error once it has passed.
        if: runner.os != 'macOS'
        continue-on-error: true
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then zip=pluginval_Windows.zip; bin=./pluginval.exe; else zip=pluginval_Linux.zip; bin=./pluginval; fi
          curl -sSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/latest/download/$zip"
          unzip -q -o pluginval.zip
          chmod +x "$bin" 2>/dev/null || true
          run="$bin"
          [ "$RUNNER_OS" = "Linux" ] && run="xvfb-run -a $bin"
          $run --strictness-level 10 --validate-in-process --timeout-ms 300000 --output-dir pluginval-logs \
            "build/PhaseAlign_artefacts/Release/VST3/Phase Align.vst3"

      - name: Upload pluginval logs
        # On failure; on Windows and Linux always, while their pluginval step is information only.
        if: failure() || (always() && runner.os != 'macOS')
        uses: actions/upload-artifact@v4
        with:
          name: pluginval-logs-${{ matrix.os }}
          path: pluginval-logs
          if-no-files-found: ignore
